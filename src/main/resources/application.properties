# ============================================================
#  MediCare - Configuracion de la aplicacion
# ============================================================

# Puerto de la aplicacion (requisito: puerto 78)
server.port=78

# ------------------------------------------------------------
# Conexion a MySQL - base de datos 'medicare'
# Se pueden sobreescribir con variables de entorno.
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/medicare?useSSL=false&serverTimezone=America/Costa_Rica&allowPublicKeyRetrieval=true
spring.datasource.username=${MEDICARE_DB_USER:root}
spring.datasource.password=${MEDICARE_DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------
# Thymeleaf
# ------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ------------------------------------------------------------
# Spring Mail (correo de bienvenida al registrar usuarios)
# Configure sus credenciales reales mediante variables de entorno:
#   MEDICARE_MAIL_USER, MEDICARE_MAIL_PASSWORD
# ------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MEDICARE_MAIL_USER:your-email@gmail.com}
spring.mail.password=${MEDICARE_MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.root=INFO
logging.level.com.medicare=INFO
