<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="cabecera(tituloPagina)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'MediCare | ' + ${tituloPagina}">MediCare</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7fb; }
        .encabezado-medicare {
            background: linear-gradient(90deg, #0d6efd 0%, #0aa2c0 100%);
            color: #ffffff;
            padding: 1.75rem 0;
        }
        .pie-medicare {
            background-color: #212529;
            color: #dee2e6;
            padding: 1.25rem 0;
            margin-top: 3rem;
        }
        .tarjeta-resumen { border: none; border-left: 5px solid #0d6efd; }
        main { min-height: 60vh; }
    </style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header th:fragment="encabezado(tituloPagina)" class="encabezado-medicare">
    <div class="container d-flex align-items-center justify-content-between">
        <div>
            <h1 class="h3 mb-1"><i class="bi bi-hospital"></i> MediCare</h1>
            <p class="mb-0 small">Plataforma de Gestión de Citas Médicas y Usuarios</p>
        </div>
        <div class="text-end" sec:authorize="isAuthenticated()">
            <span class="d-block small">Sesión activa</span>
            <strong sec:authentication="name">usuario</strong>
        </div>
    </div>
</header>

<!-- ================= NAVBAR ================= -->
<nav th:fragment="barraNavegacion" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/inicio}">
            <i class="bi bi-house-door"></i> Inicio
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/usuarios}">
                        <i class="bi bi-people"></i> Usuarios
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/roles}">
                        <i class="bi bi-shield-lock"></i> Roles
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','MEDICO')">
                    <a class="nav-link" th:href="@{/citas}">
                        <i class="bi bi-calendar-heart"></i> Citas Médicas
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('PACIENTE')">
                    <a class="nav-link" th:href="@{/citas}">
                        <i class="bi bi-calendar-check"></i> Consultar Citas
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/consultas}">
                        <i class="bi bi-search"></i> Consultas Avanzadas
                    </a>
                </li>
            </ul>

            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ================= FOOTER ================= -->
<footer th:fragment="pie" class="pie-medicare">
    <div class="container d-flex flex-wrap justify-content-between">
        <span class="small">&copy; 2026 MediCare — Centro de Salud</span>
        <span class="small">Universidad Fidélitas | Desarrollo de Aplicaciones Web y Patrones</span>
    </div>
</footer>

<!-- ================= SCRIPTS ================= -->
<div th:fragment="guiones">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
