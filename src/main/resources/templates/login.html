<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera('Iniciar sesión')}"></head>
<body>

<header th:replace="~{fragmentos/plantilla :: encabezado('Iniciar sesión')}"></header>
<nav th:replace="~{fragmentos/plantilla :: barraNavegacion}"></nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    Acceso a MediCare
                </div>
                <div class="card-body">

                    <div class="alert alert-danger" th:if="${param.error}">
                        Credenciales incorrectas. Verifique el correo y la contraseña.
                    </div>
                    <div class="alert alert-success" th:if="${param.logout}">
                        La sesión se cerró correctamente.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="admin@medicare.com" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            Ingresar
                        </button>
                    </form>

                </div>
                <div class="card-footer bg-light small text-secondary">
                    Usuarios de prueba: admin@medicare.com · medico@medicare.com · paciente@medicare.com
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
<div th:replace="~{fragmentos/plantilla :: guiones}"></div>

</body>
</html>
