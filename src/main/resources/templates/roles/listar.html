<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera(${tituloVista})}"></head>
<body>

<header th:replace="~{fragmentos/plantilla :: encabezado(${tituloVista})}"></header>
<nav th:replace="~{fragmentos/plantilla :: barraNavegacion}"></nav>

<main class="container my-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0"><span th:text="${tituloVista}">Roles</span></h2>
        <a class="btn btn-primary" th:href="@{/admin/roles/nuevo}">
            Nuevo Rol
        </a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${mensajeExito}">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${mensajeError}">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nombre del rol</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="registro : ${listaRoles}">
                    <td th:text="${registro.id}">1</td>
                    <td>
                        <span class="badge bg-info text-dark fs-6" th:text="${registro.nombre}">ADMIN</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/admin/roles/editar/{id}(id=${registro.id})}" title="Editar">Editar</a>
                        <form class="d-inline" method="post"
                              th:action="@{/admin/roles/eliminar/{id}(id=${registro.id})}"
                              onsubmit="return confirm('¿Desea eliminar este rol?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(listaRoles)}">
                    <td colspan="3" class="text-center text-secondary py-4">
                        No hay roles registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
<div th:replace="~{fragmentos/plantilla :: guiones}"></div>

</body>
</html>
