<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera(${tituloVista})}"></head>
<body>

<header th:replace="~{fragmentos/plantilla :: encabezado(${tituloVista})}"></header>
<nav th:replace="~{fragmentos/plantilla :: barraNavegacion}"></nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <i class="bi bi-person-badge"></i> <span th:text="${tituloVista}">Detalle</span>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-secondary">Identificador</span>
                        <strong th:text="${usuario.id}">1</strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-secondary">Nombre</span>
                        <strong th:text="${usuario.nombre}">Nombre</strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-secondary">Correo electrónico</span>
                        <strong th:text="${usuario.email}">correo</strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-secondary">Rol asignado</span>
                        <span class="badge bg-info text-dark"
                              th:text="${usuario.rol != null} ? ${usuario.rol.nombre} : 'SIN ROL'">ROL</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-secondary">Estado</span>
                        <span class="badge" th:classappend="${usuario.activo} ? 'bg-success' : 'bg-secondary'"
                              th:text="${usuario.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-secondary">Fecha de creación</span>
                        <strong th:text="${usuario.fechaCreacion != null} ? ${#temporals.format(usuario.fechaCreacion, 'dd/MM/yyyy HH:mm')} : '-'">-</strong>
                    </li>
                </ul>
                <div class="card-body d-flex justify-content-between">
                    <a class="btn btn-outline-secondary" th:href="@{/admin/usuarios}">
                        <i class="bi bi-arrow-left"></i> Volver al listado
                    </a>
                    <a class="btn btn-primary" th:href="@{/admin/usuarios/editar/{id}(id=${usuario.id})}">
                        <i class="bi bi-pencil"></i> Editar
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
<div th:replace="~{fragmentos/plantilla :: guiones}"></div>

</body>
</html>
